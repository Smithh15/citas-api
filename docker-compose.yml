services:
  postgres:
    image: postgres:16-alpine
    container_name: citas-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: citas
      POSTGRES_PASSWORD: citas
      POSTGRES_DB: citas
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citas -d citas"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: citas-api-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
