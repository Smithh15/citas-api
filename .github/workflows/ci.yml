name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: citas
          POSTGRES_PASSWORD: citas
          POSTGRES_DB: citas
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U citas -d citas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://citas:citas@localhost:5433/citas?sslmode=disable
      REDIS_ADDR: localhost:6379
      JWT_SECRET: ci-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

      - name: Run migrations
        run: migrate -database "$DATABASE_URL" -path migrations up

      - name: Unit tests
        run: go test ./...

      - name: Integration tests (with race detector)
        run: go test ./... -tags=integration -race -v
