basePath: /
definitions:
  handlers.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handlers.RegisterRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        minLength: 8
        type: string
      role:
        enum:
        - patient
        - doctor
        type: string
      specialty:
        description: solo requerido si role=doctor, se valida a mano abajo
        type: string
    required:
    - email
    - full_name
    - password
    - role
    type: object
host: localhost:8080
info:
  contact: {}
  description: Sistema de reservas de citas médicas con control de concurrencia
  title: Citas API
  version: "1.0"
paths:
  /appointments/available:
    get:
      description: Calcula los horarios libres de un doctor en una fecha dada, cruzando
        su disponibilidad semanal contra las citas ya reservadas
      parameters:
      - description: ID del doctor (doctor_profiles.id)
        in: query
        name: doctor_id
        required: true
        type: string
      - description: Fecha en formato YYYY-MM-DD
        in: query
        name: date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                type: string
              type: array
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Consulta cupos disponibles de un doctor
      tags:
      - appointments
  /auth/login:
    post:
      consumes:
      - application/json
      description: Valida credenciales y devuelve un JWT
      parameters:
      - description: Credenciales
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Inicia sesión
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Crea un paciente, doctor o admin
      parameters:
      - description: Datos de registro
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Registra un nuevo usuario
      tags:
      - auth
swagger: "2.0"
